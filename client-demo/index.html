<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic NPC — Reference Client</title>
<style>
  :root { --bg:#12141a; --panel:#1b1e27; --line:#2a2e3a; --fg:#e6e8ee; --muted:#8b90a0;
          --accent:#6ea8fe; --npc:#7ee0a8; --err:#ff8080; --you:#c9b3ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #status { font-size:12px; color:var(--muted); margin-left:auto; }
  #status.on { color:var(--npc); }
  #status.err { color:var(--err); }
  main { display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100vh - 53px); }
  .side { border-right:1px solid var(--line); padding:16px; overflow-y:auto; }
  .chat { display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 16px; padding:12px; }
  legend { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:0 6px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { width:100%; background:var(--bg); color:var(--fg);
           border:1px solid var(--line); border-radius:6px; padding:7px 9px; }
  textarea { resize:vertical; }
  button { background:var(--accent); color:#0b1020; border:none; border-radius:6px;
           padding:8px 12px; font-weight:600; cursor:pointer; }
  button.sec { background:var(--panel); color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  .msg { max-width:78%; padding:9px 12px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .msg.you { align-self:flex-end; background:#2a2440; }
  .msg.you .who { color:var(--you); }
  .msg.npc { align-self:flex-start; background:var(--panel); }
  .msg.npc .who { color:var(--npc); }
  .msg.sys { align-self:center; background:transparent; color:var(--muted); font-size:12px; max-width:100%; }
  .msg.err { align-self:center; background:#3a1e1e; color:var(--err); max-width:100%; }
  .composer { border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px; }
  .composer input { flex:1; }
  .composer button { flex:0 0 auto; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .actions button { flex:1 1 auto; font-size:12px; padding:6px 8px; }
</style>
</head>
<body>
<header>
  <h1>Agentic NPC — Reference Client</h1>
  <span id="status">disconnected</span>
</header>
<main>
  <div class="side">
    <fieldset>
      <legend>Connection</legend>
      <label>WebSocket URL</label>
      <input id="url" value="ws://localhost:8080/api/v1/ws">
      <label>Username</label>
      <input id="user" value="demo_player" autocomplete="off">
      <label>Password</label>
      <input id="pass" type="password" value="demo_pass_123">
      <div class="row">
        <button id="register" class="sec">Register</button>
        <button id="login">Log in</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>NPC</legend>
      <label>Talk to</label>
      <select id="npc">
        <option>Elara</option><option>Baelor</option><option>Elian</option>
        <option>Kaelen</option><option>Lian</option><option>Marcus</option>
        <option>Rook</option><option>Silas</option>
      </select>
      <label>Item / keyword (for gift &amp; quest-item)</label>
      <input id="keyword" value="apple" autocomplete="off">
      <div class="actions">
        <button id="gift" class="sec" disabled>Give gift</button>
        <button id="submit" class="sec" disabled>Submit item</button>
        <button id="interact" class="sec" disabled>Interact</button>
        <button id="look" class="sec" disabled>Look at</button>
        <button id="attack" class="sec" disabled>Attack</button>
      </div>
    </fieldset>
  </div>
  <div class="chat">
    <div id="log"></div>
    <div class="composer">
      <input id="question" placeholder="Ask the NPC a question…" disabled>
      <button id="ask" disabled>Ask</button>
    </div>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const log = $("log"), status = $("status");
  let ws = null, authed = false;

  const gameButtons = ["ask","gift","submit","interact","look","attack","question"];
  const setGameEnabled = on => gameButtons.forEach(id => $(id).disabled = !on);

  function setStatus(text, cls) { status.textContent = text; status.className = cls || ""; }

  function add(cls, who, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    if (who) { const w = document.createElement("div"); w.className = "who"; w.textContent = who; el.appendChild(w); }
    el.appendChild(document.createTextNode(text));
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function send(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { add("err", null, "Not connected."); return; }
    ws.send(JSON.stringify(obj));
  }

  function connect(then) {
    if (ws && ws.readyState === WebSocket.OPEN) { then(); return; }
    ws = new WebSocket($("url").value.trim());
    setStatus("connecting…");
    ws.onopen = () => { setStatus("connected — authenticating…"); then(); };
    ws.onclose = () => { setStatus("disconnected", "err"); authed = false; setGameEnabled(false); };
    ws.onerror = () => { setStatus("connection error", "err"); };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { add("err", null, ev.data); return; }
      const { action_type, content } = m;
      if (action_type === "LOGIN_SUCCESS") {
        authed = true; setGameEnabled(true); setStatus("authenticated", "on");
        add("sys", null, content); return;
      }
      if (action_type === "ERROR") { add("err", null, content); return; }
      if (action_type === "ADMIN_ACK") { add("sys", null, content); return; }
      add("npc", $("npc").value + " · " + action_type, content);   // SPEAK et al.
    };
  }

  const auth = type => connect(() =>
    send({ event_type: type, username: $("user").value, password: $("pass").value }));

  $("register").onclick = () => auth("REGISTER_PLAYER");
  $("login").onclick = () => auth("LOGIN_PLAYER");

  function gameEvent(event_type, extra) {
    if (!authed) { add("err", null, "Log in first."); return; }
    send(Object.assign({ event_type, target_npc_name: $("npc").value }, extra));
  }

  function ask() {
    const q = $("question").value.trim();
    if (!q) return;
    add("you", "You → " + $("npc").value, q);
    gameEvent("PLAYER_ASKED_QUESTION", { question_text: q });
    $("question").value = "";
  }
  $("ask").onclick = ask;
  $("question").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

  const kw = () => ({ keyword: $("keyword").value.trim() });
  $("gift").onclick     = () => { add("you", "You → " + $("npc").value, "🎁 gift: " + $("keyword").value); gameEvent("PLAYER_GAVE_GIFT", kw()); };
  $("submit").onclick   = () => { add("you", "You → " + $("npc").value, "📦 submit: " + $("keyword").value); gameEvent("PLAYER_SUBMITTED_QUEST_ITEM", kw()); };
  $("interact").onclick = () => { add("you", "You → " + $("npc").value, "🤝 interact"); gameEvent("PLAYER_INTERACT", {}); };
  $("look").onclick     = () => { add("you", "You → " + $("npc").value, "👁 look at"); gameEvent("PLAYER_LOOKED_AT_NPC", {}); };
  $("attack").onclick   = () => { add("you", "You → " + $("npc").value, "⚔ attack"); gameEvent("PLAYER_ATTACKED", {}); };

  add("sys", null, "Enter a username/password, then Register (or Log in). After LOGIN_SUCCESS, ask a question or use the NPC action buttons.");
})();
</script>
</body>
</html>
