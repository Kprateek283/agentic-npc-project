syntax = "proto3";

package ai;
option go_package = "./internal/proto";

// The AIBrain service definition.
service AIBrain {
  rpc Think(EventRequest) returns (ActionResponse) {}
  // ThinkStream streams the response token-by-token (C3). The RAG path streams real
  // LLM tokens; other paths yield their whole answer as a single chunk. Unary Think is
  // kept for compatibility and as the non-streaming fallback.
  rpc ThinkStream(EventRequest) returns (stream TokenChunk) {}
}

// --- (MemoryMessage and EmotionStateMessage are unchanged) ---
message MemoryMessage {
  string description = 1;
  double importance = 2;
  string event_type = 3;
  repeated string participants = 4;
}

message EmotionStateMessage {
  double joy = 1;
  double sadness = 2;
  double anger = 3;
  double fear = 4;
  double trust = 5;
}


// --- THIS IS THE UPDATED REQUEST MESSAGE ---
message EventRequest {
  // Static paths (the "key" for the Python agent)
  string personality_path = 1;
  string backstory_path = 2;
  string lore_path = 3;

  // Dynamic context (the "payload")
  EmotionStateMessage current_emotions = 4;
  repeated MemoryMessage recent_memories = 5;

  // Event details
  string event_type = 6;
  string question_text = 7;
  string source_entity_id = 8;

  // --- NEW FIELDS FOR QUEST CONTEXT ---
  int32 current_quest_step = 9;
  float completion_rate = 10;
  // ------------------------------------
}
// ------------------------------------------

message ActionResponse {
  string action_type = 1;
  string content = 2;
}

// TokenChunk is one frame of a streamed response (C3). Partial frames carry an
// incremental `text` delta with done=false; the final frame has done=true and the
// action_type (e.g. "SPEAK"). Consumers concatenate the deltas for the full content.
message TokenChunk {
  string text = 1;
  bool done = 2;
  string action_type = 3;
}

